[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ednaflow-lca"
version = "0.1.0"
description = "Offline standalone adaptation of eDNAFlow LCA taxonomy assignment"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Olly Berry"},
]

[project.scripts]
ednaflow-lca = "ednaflow_lca.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
