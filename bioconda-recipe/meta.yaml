{% set version = "0.1.0" %}

package:
  name: ednaflow-lca
  version: {{ version }}

source:
  url: https://github.com/csiro/ednaflow-lca/archive/refs/tags/{{ version }}.tar.gz
  sha256: REPLACE_WITH_RELEASE_SHA256

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=61
  run:
    - python >=3.10

test:
  imports:
    - ednaflow_lca
  commands:
    - ednaflow-lca --help

about:
  home: https://github.com/csiro/ednaflow-lca
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Offline standalone adaptation of eDNAFlow LCA taxonomy assignment
  dev_url: https://github.com/csiro/ednaflow-lca

extra:
  recipe-maintainers:
    - ollybolly
