name: Galaxy execution test

on:
  push:
  pull_request:

jobs:
  galaxy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and Planemo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install planemo

      - name: Confirm private CLI is available
        run: ednaflow-lca --help

      - name: Execute Galaxy tool tests
        run: planemo test galaxy/ednaflow_lca.xml --no_dependency_resolution
