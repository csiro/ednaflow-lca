name: Galaxy validation

on:
  push:
  pull_request:

jobs:
  planemo-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Planemo
        run: python -m pip install planemo

      - name: Lint Galaxy wrapper
        run: planemo lint galaxy/ednaflow_lca.xml
