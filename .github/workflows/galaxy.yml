name: Galaxy validation

on:
  push:
  pull_request:

jobs:
  planemo-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Planemo
        run: python -m pip install planemo

      - name: Check Data Manager Python syntax
        run: python -m py_compile galaxy/data_manager/data_manager_ncbi_rankedlineage.py

      - name: Check Tool Data Table XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("galaxy/data_manager/tool_data_table_conf.xml.sample")
          print("Tool Data Table XML: OK")
          PY

      - name: Check Data Manager configuration XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("galaxy/data_manager_conf.xml")
          print("Data Manager configuration XML: OK")
          PY

      - name: Lint NCBI taxonomy Data Manager
        run: planemo lint galaxy/data_manager/data_manager_ncbi_rankedlineage.xml

      - name: Lint eDNAFlow LCA wrapper
        run: planemo lint galaxy/ednaflow_lca.xml

  data-manager-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Planemo
        run: python -m pip install planemo

      - name: Smoke test taxonomy Data Manager script
        run: |
          mkdir -p /tmp/ednaflow-dm
          python galaxy/data_manager/data_manager_ncbi_rankedlineage.py \
            --output /tmp/ednaflow-dm/result.json \
            --name "NCBI Taxonomy Test" \
            --source-archive galaxy/data_manager/test-data/new_taxdump_test.zip
          cat /tmp/ednaflow-dm/result.json
          test -f /tmp/ednaflow-dm/result.json_files/rankedlineage.dmp
          python -m json.tool /tmp/ednaflow-dm/result.json

      - name: Execute NCBI taxonomy Data Manager test
        run: planemo test galaxy/data_manager/data_manager_ncbi_rankedlineage.xml --no_dependency_resolution
